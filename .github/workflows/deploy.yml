name: Deploy Online CRM

# Manual dispatch only. An automatic deploy on every push would restart the
# app while the floor is mid-call.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          # These point at the ONLINE CRM's box. They are this repository's own
          # secrets — the counsellor CRM has its own, in its own repository.
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd ~/app
            git checkout -- package-lock.json 2>/dev/null || true
            git pull origin main
            # `npm install`, not `npm ci`. ci deletes node_modules and
            # reinstalls from scratch, which needs the old and new trees on
            # disk at once — on this 8GB volume, shared with a 3.6GB swapfile,
            # that filled the disk three times and killed the deploy. install
            # is incremental and reads the same lockfile.
            npm install
            npx prisma generate
            # The schema is kept in step with `db push`, not migrations — the
            # migrations folder stopped being maintained long ago and running
            # `migrate deploy` here would build the wrong schema. See the
            # deployment notes for the one line of expected `migrate diff`
            # drift (the custom LID sequence).
            npx prisma db push --accept-data-loss
            # Gives leads created before the merge feature their first
            # LeadInterest row. Without it their next enquiry is recorded as
            # interest #1 rather than #2, so the "+1" badge never appears and
            # the count stays one short for good. Idempotent — a no-op once
            # every lead has history.
            npm run db:backfill-interests
            NODE_OPTIONS='--max-old-space-size=2048' npm run build
            pm2 restart online-crm --update-env
