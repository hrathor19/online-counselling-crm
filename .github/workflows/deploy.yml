name: Deploy Online CRM

# Manual dispatch only. An automatic deploy on every push would restart the
# app while the floor is mid-call.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          # These point at the ONLINE CRM's box. They are this repository's own
          # secrets — the counsellor CRM has its own, in its own repository.
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd ~/app
            # Stop before touching anything if there is not enough room to
            # finish. A build that runs out of disk halfway does not just
            # fail — it leaves a truncated .next and a pm2 process that has
            # exited, so the site serves 502 until someone SSHes in. Failing
            # here instead leaves the running app untouched.
            FREE_MB=$(df -Pm / | awk 'NR==2 {print $4}')
            if [ "$FREE_MB" -lt 3000 ]; then
              echo "Only ${FREE_MB}MB free on / — a build needs ~3GB."
              echo "Reclaim space (npm cache clean --force, rm -rf .next, pm2 flush)"
              echo "or grow the volume, then run this workflow again."
              exit 1
            fi
            git checkout -- package-lock.json 2>/dev/null || true
            git pull origin main
            # `npm install`, not `npm ci`. ci deletes node_modules and
            # reinstalls from scratch, which needs the old and new trees on
            # disk at once — on this 8GB volume, shared with a 3.6GB swapfile,
            # that filled the disk three times and killed the deploy. install
            # is incremental and reads the same lockfile.
            npm install
            npx prisma generate
            # The schema is kept in step with `db push`, not migrations — the
            # migrations folder stopped being maintained long ago and running
            # `migrate deploy` here would build the wrong schema. See the
            # deployment notes for the one line of expected `migrate diff`
            # drift (the custom LID sequence).
            npx prisma db push --accept-data-loss
            # Gives leads created before the merge feature their first
            # LeadInterest row. Without it their next enquiry is recorded as
            # interest #1 rather than #2, so the "+1" badge never appears and
            # the count stays one short for good. Idempotent — a no-op once
            # every lead has history.
            npm run db:backfill-interests
            # The webpack pack cache from the previous deploy is dead weight
            # — a fresh build writes its own — and on this 8GB volume it is
            # the difference between a build and an ENOSPC. Clearing it before
            # the build, not after, is what actually buys the headroom.
            rm -rf .next/cache
            NODE_OPTIONS='--max-old-space-size=2048' npm run build
            # And again afterwards: it is only read by the NEXT build, never
            # at runtime, so leaving it occupying ~1GB until the next deploy
            # is what lets the disk creep back to full.
            rm -rf .next/cache
            # `restart` alone fails with "Process or Namespace not found" when
            # a previous deploy died mid-build and took the process with it —
            # which leaves the box serving 502s with no way back except a
            # manual pm2 start. Fall through to start so a dead box heals.
            pm2 restart online-crm --update-env || pm2 start npm --name online-crm -- start
            pm2 save
